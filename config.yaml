# Obsidian to Markdown Conversion Configuration

# Root directories (absolute or relative to this config file)
paths:
  obsidian_root: ""       # Path to your Obsidian vault
  output_root: ""         # Path to output directory

# Which vault folders are published into which site folder: one mapping per
# site folder. A note belongs to the most specific mapped folder that holds it.
source_mappings: []
  # - source: "notes"
  #   destination: "_notes"
  # - sources: ["uni/master/courses", "uni/bachelor/courses"]
  #   destination: "_courses"

# Image handling (relative to their respective roots)
images:
  source_dir: "assets/images"
  destination_dir: "assets/img"

# Links: the processor gives each page's address, as its site's generator does
# by default (for Jekyll, "_courses" -> "/courses/<page>.html"). A mapping can
# start its addresses elsewhere with url, such as url: "/study". A link to a note
# that is not published (not written yet, or outside every mapping) becomes its
# plain display text.

# The site the pages are written for
processor:
  # "jekyll" is the only one
  type: "jekyll"

  # The layout a page gets when its front matter names none; without it, no layout is added
  # default_layout: "note"

  # Set to "pretty" when the site's _config.yml does: addresses end in "/" instead of ".html"
  # permalink: "pretty"

# Runtime defaults (can be overridden via CLI flags)
runtime:
  validate_only: false
  force_create: false
  fix_source: false