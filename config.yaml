# Obsidian to Markdown Conversion Configuration

# Root directories (absolute or relative to this config file)
paths:
  obsidian_root: ""       # Path to your Obsidian vault
  output_root: ""         # Path to output directory

# Which vault folders are published into which site folder: one mapping per
# site folder. A note belongs to the most specific mapped folder that holds it.
source_mappings: []
  # - source: "notes"
  #   destination: "_notes"
  # - sources: ["uni/master/courses", "uni/bachelor/courses"]
  #   destination: "_courses"

# Image handling (relative to their respective roots)
images:
  source_dir: "assets/images"
  destination_dir: "assets/img"

# Links: "markdown" links each page's file, relative to the linking page;
# "jekyll" links its URL, as Jekyll makes it by default ("_courses" ->
# "/courses/<page>.html"), and a mapping can start its URLs elsewhere with url,
# such as url: "/study". A link to a note that is not published (not written
# yet, or outside every mapping) becomes its plain display text.

# The site the pages are written for
processor:
  # "markdown" (plain Markdown for any site, docs/normalized-markdown.md) or "jekyll"
  type: "jekyll"

  # Jekyll only: the layout a page gets when its front matter names none; without it, no layout is added
  # default_layout: "note"

  # Jekyll only: set to "pretty" when the site's _config.yml does: addresses end in "/" instead of ".html"
  # permalink: "pretty"

# Runtime defaults (can be overridden via CLI flags)
runtime:
  validate_only: false
  force_create: false
  fix_source: false